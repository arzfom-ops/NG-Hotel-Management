<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NG Hotel Management</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #F8FAFC; }
    </style>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { primary: '#0064D2' } } }
        }
    </script>
</head>
<body class="flex h-screen overflow-hidden text-slate-800">

    <!-- Mobile Header -->
    <div class="md:hidden fixed top-0 w-full bg-white border-b z-50 flex justify-between items-center p-4">
        <h1 class="text-lg font-bold text-primary">NG Hotel</h1>
        <button id="mobileMenuBtn" class="text-slate-600"><i class="ph ph-list text-2xl"></i></button>
    </div>

    <!-- Sidebar -->
    <aside id="sidebar" class="bg-white w-64 h-full border-r flex flex-col fixed md:relative transform -translate-x-full md:translate-x-0 transition-transform duration-200 z-40 mt-14 md:mt-0">
        <div class="p-6 hidden md:block">
            <h1 class="text-xl font-bold text-primary tracking-tight">NG Hotel Mgt.</h1>
        </div>
        <nav class="flex-1 px-4 space-y-2 mt-4 md:mt-0">
            <a href="#" class="flex items-center gap-3 p-3 rounded-lg text-slate-600 hover:bg-slate-50 transition-colors">
                <i class="ph ph-squares-four text-xl"></i> Overview
            </a>
            <a href="#" class="flex items-center gap-3 p-3 rounded-lg bg-blue-50 text-primary font-semibold transition-colors">
                <i class="ph ph-desktop-tower text-xl"></i> Frontdesk
            </a>
            <a href="#" class="flex items-center gap-3 p-3 rounded-lg text-slate-600 hover:bg-slate-50 transition-colors">
                <i class="ph ph-calendar-check text-xl"></i> Reservations
            </a>
            <a href="#" class="flex items-center gap-3 p-3 rounded-lg text-slate-600 hover:bg-slate-50 transition-colors">
                <i class="ph ph-broom text-xl"></i> Housekeeping
            </a>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col h-full mt-14 md:mt-0 w-full overflow-hidden">
        <!-- Topbar -->
        <header class="bg-white border-b px-6 py-4 flex justify-between items-center">
            <h2 class="text-xl font-semibold hidden md:block">Frontdesk / Tape Chart</h2>
            <div class="flex items-center gap-4 ml-auto">
                <div class="flex items-center gap-2 px-3 py-1.5 border rounded-md cursor-pointer hover:bg-slate-50">
                    <span id="active-property-name" class="text-sm font-medium">Memuat...</span>
                    <i class="ph ph-caret-down text-sm"></i>
                </div>
                <div class="w-8 h-8 rounded-full bg-primary text-white flex items-center justify-center font-bold">A</div>
            </div>
        </header>

        <!-- Content Area -->
        <div class="p-4 md:p-6 flex-1 overflow-y-auto">
            <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-6 min-h-[500px] flex flex-col">
                
                <!-- Status Koneksi -->
                <div id="supabase-status" class="p-4 rounded-md bg-slate-50 border text-sm text-slate-600 mb-6">
                    <i class="ph ph-spinner animate-spin inline-block"></i> Menghubungkan ke Supabase...
                </div>

                <!-- Container Tape Chart -->
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-lg font-medium">Room Allotment</h3>
                    <button class="bg-primary hover:bg-blue-700 text-white px-4 py-2 rounded-md text-sm font-medium transition-colors">
                        + New Reservation
                    </button>
                </div>
                
                <div id="tape-chart-wrapper" class="flex-1 border border-slate-200 rounded-lg overflow-x-auto bg-slate-50 relative min-h-[300px]">
                    <!-- Area kosong ini siap diisi kalender oleh Jules -->
                </div>

            </div>
        </div>
    </main>

    <script>
        // Inisialisasi Supabase dengan Key Baru
        const SUPABASE_URL = 'https://xvoibranzxbtcyvaphll.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_9JNXq091DMUBkfsJhtdgcw_lWU54FXO';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function initApp() {
            const statusDiv = document.getElementById('supabase-status');
            const propNameSpan = document.getElementById('active-property-name');
            
            try {
                // Cek koneksi & ambil nama hotel
                const { data, error } = await supabaseClient.from('properties').select('name').limit(1);
                
                if (error) throw error;
                
                if (data && data.length > 0) {
                    statusDiv.innerHTML = `<span class="text-green-600 font-semibold"><i class="ph ph-check-circle"></i> Berhasil terhubung.</span>`;
                    statusDiv.className = "p-4 rounded-md bg-green-50 border border-green-200 text-sm mb-6 hidden"; 
                    propNameSpan.textContent = data[0].name;
                }
            } catch (err) {
                statusDiv.innerHTML = `<span class="text-red-600 font-semibold"><i class="ph ph-warning-circle"></i> Gagal terhubung database:</span> ${err.message}`;
                statusDiv.className = "p-4 rounded-md bg-red-50 border border-red-200 text-sm mb-6";
                propNameSpan.textContent = "Error";
            }
        }

        // Toggle Mobile Menu
        document.getElementById('mobileMenuBtn').addEventListener('click', () => {
            document.getElementById('sidebar').classList.toggle('-translate-x-full');
        });

        // Jalankan saat halaman siap
        window.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
